<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scroll Meter</title>
    <link rel="stylesheet" href="../ui/base.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <span class="wordmark">Scroll Meter</span>
      <span id="date" class="kicker"></span>
      <button id="settings" class="link">Settings</button>
    </header>

    <main>
      <section class="hero">
        <div id="gauge" class="gauge" aria-hidden="true">
          <span id="gauge-to" class="g-label g-to"></span>
          <div class="g-scale"><i id="gauge-fill"></i><b id="gauge-mark"></b></div>
          <span id="gauge-from" class="g-label g-from"></span>
        </div>

        <div class="reading">
          <p class="lede">Today your thumb travelled</p>
          <div id="today" class="big">0 m</div>
          <p id="compare" class="compare"></p>
          <p id="climb-left" class="note" hidden></p>
        </div>
      </section>

      <section id="site-status" class="site-status" hidden></section>

      <section class="block">
        <h2 class="section-title">Where it went</h2>
        <ol id="sites" class="sites"></ol>
        <p id="sites-empty" class="empty" hidden>Nothing measured yet today.</p>
      </section>

      <section id="records-block" class="block" hidden>
        <h2 class="section-title">Today's records</h2>
        <dl class="records">
          <div>
            <dt class="kicker">Top speed</dt>
            <dd id="rec-speed" class="rec"></dd>
            <dd id="rec-speed-sub" class="sub"></dd>
          </div>
          <div>
            <dt class="kicker">Binge</dt>
            <dd id="rec-binge" class="rec"></dd>
            <dd id="rec-binge-sub" class="sub"></dd>
          </div>
          <div>
            <dt class="kicker">Back up</dt>
            <dd id="rec-up" class="rec"></dd>
            <dd class="sub">second thoughts</dd>
          </div>
        </dl>
      </section>

      <section class="block">
        <h2 class="section-title">Last 7 days <span id="week-total" class="kicker"></span></h2>
        <canvas id="chart" aria-label="Distance scrolled per day, last 7 days"></canvas>
      </section>

      <button id="wrapped" class="cta">
        <span>Make this week's card</span>
        <span class="arrow" aria-hidden="true">→</span>
      </button>

      <footer class="privacy kicker">Kept on this device · nothing uploaded</footer>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
