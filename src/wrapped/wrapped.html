<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scroll Wrapped · Scroll Meter</title>
    <link rel="icon" href="../../icons/icon32.png" />
    <link rel="stylesheet" href="../ui/base.css" />
    <link rel="stylesheet" href="wrapped.css" />
  </head>
  <body>
    <header class="masthead tape">
      <div class="masthead-inner">
        <span class="wordmark">SCROLL METER</span>
        <span class="masthead-sub">Weekly card</span>
      </div>
    </header>
    <main class="layout">
      <section class="preview">
        <canvas id="card" aria-label="Your weekly Scroll Wrapped card"></canvas>
      </section>

      <aside class="controls">
        <h1>Your week, measured.</h1>
        <p id="demo-note" class="demo" hidden>Showing made-up demo data.</p>

        <div class="group">
          <div class="group-label">Week</div>
          <div class="week-nav">
            <button id="prev" class="btn quiet" aria-label="Previous week">←</button>
            <span id="range" class="range"></span>
            <button id="next" class="btn quiet" aria-label="Next week">→</button>
          </div>
        </div>

        <div class="group">
          <div class="group-label">Style</div>
          <div class="chips" data-key="theme">
            <button class="chip" data-value="tape">Tape</button>
            <button class="chip" data-value="receipt">Receipt</button>
          </div>
        </div>

        <div class="group">
          <div class="group-label">Size</div>
          <div class="chips" data-key="format">
            <button class="chip" data-value="story">Story 9:16</button>
            <button class="chip" data-value="square">Square 1:1</button>
          </div>
          <p class="hint">Story fits Instagram Stories and WhatsApp Status. Square fits feeds, X and Reddit.</p>
        </div>

        <div class="actions">
          <button id="download" class="btn solid">Download PNG</button>
          <button id="copy" class="btn">Copy image</button>
          <span id="toast" class="toast" role="status"></span>
        </div>

        <p class="privacy">The card is drawn on your device. It only goes somewhere if you post it.</p>
      </aside>
    </main>
    <script type="module" src="wrapped.js"></script>
  </body>
</html>
